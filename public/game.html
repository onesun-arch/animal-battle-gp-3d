<style>

.top{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;margin-bottom:10px}.badges{display:flex;gap:7px;flex-wrap:wrap}.badge{padding:8px 10px;background:#fff;border:1px solid #d8e6ee;border-radius:11px;font-weight:900}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:11px}.racebox{padding:11px}.arena{height:690px;position:relative;overflow:hidden;border-radius:18px;background:#315c2d url("./assets/amazon-race-arena.png") center/cover no-repeat;box-shadow:inset 0 0 55px #1f120466,0 20px 55px #07130b55}.arena canvas{position:absolute;inset:0;width:100%;height:100%;display:block}.arena:before{content:"";position:absolute;inset:-25%;pointer-events:none;z-index:2;opacity:0;background:repeating-conic-gradient(from 90deg at 50% 58%,#fff0 0 8deg,#dfffea2b 9deg 9.5deg,#fff0 10deg 18deg);transform:scale(1.2);transition:opacity .25s}.arena.racing:before{opacity:.42;animation:rush .22s linear infinite}.arena:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,transparent 58%,#120a0338);box-shadow:inset 0 0 90px #07130b99;z-index:1}@keyframes rush{to{transform:scale(1.48)}}
.track{display:none}
.center{position:absolute;left:50%;top:17%;transform:translate(-50%,-50%);width:min(72%,620px);display:grid;place-items:center;text-align:center;color:#fff;text-shadow:0 3px 12px #071b0d;z-index:3;pointer-events:none}.center h2{letter-spacing:.22em;margin-bottom:8px}.comment{background:#123c2cdd;padding:9px 14px;border:1px solid #ffffff38;border-radius:999px;font-weight:900;font-size:13px;box-shadow:0 8px 22px #0005}
.lap{position:absolute;right:14px;top:14px;background:#10241ee8;color:#fff;padding:9px 12px;border-radius:12px;font-weight:1000;z-index:5}.racer{position:absolute;width:78px;height:78px;padding:4px;border-radius:50%;background:linear-gradient(145deg,#fff,#d9c295);border:3px solid var(--c);display:grid;place-items:center;transform:translate(-50%,-50%);transition:left .12s linear,top .12s linear;box-shadow:0 8px 18px #0008;z-index:4}.racer img{display:block;width:100%;height:100%;border-radius:50%;object-fit:cover;pointer-events:none}.racer.lead{box-shadow:0 0 0 5px #ffd45c,0 9px 25px #0008;animation:pulse .45s ease-in-out infinite alternate}.racer.sprint{animation:shake .12s linear infinite}@keyframes pulse{to{transform:translate(-50%,-50%) scale(1.12)}}@keyframes shake{50%{margin-left:4px}}
.side{padding:13px}.code{font-size:28px;letter-spacing:5px;font-weight:1000;color:#1e7b4b}.room-actions{display:flex;gap:6px;margin:8px 0 2px}.room-actions .btn{flex:1;padding:9px;font-size:13px}.players{display:grid;gap:6px;margin:10px 0}.player{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:8px;background:#fff;border:1px solid #d8e6ee;border-radius:12px;padding:8px}.player.me{border:2px solid #2b8a57}.player.eliminated{opacity:.55;background:#ececec;border-color:#aaa}.ready{color:#16924e;font-weight:900}.wait{color:#d57f15;font-weight:900}.out{color:#a52828;font-weight:1000}.predict{background:#fff;border:1px solid #d8e6ee;border-radius:14px;padding:10px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.grid select,.predict input{width:100%;padding:9px 5px;border:1px solid #c9dbe6;border-radius:9px}.money-actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:7px}.money-actions .btn{padding:9px;font-size:13px}.loan-note{font-size:11px;opacity:.68;margin-top:5px}.actions{display:grid;gap:7px;margin-top:9px}.status{margin-top:9px;padding:9px;border-radius:11px;background:#173c2c;color:#fff;font-size:13px;line-height:1.45}.board{margin-top:10px}.rank{display:grid;grid-template-columns:25px 1fr auto;gap:6px;background:#fff;margin-top:4px;padding:7px;border-radius:10px}.bar{height:6px;background:#e5eef3;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#2e9b5c,#d18b2e)}.inline-sprite{width:36px;height:36px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:4px;border:2px solid #fff;box-shadow:0 2px 7px #0003}

<body>
<div class="wrap">
<section id="lobby" class="panel lobby">
<h1>🏁 온라인 애니멀 배틀 GP</h1>
<p>초대 링크나 4자리 방 코드로 최대 6명이 실시간 함께 플레이합니다.</p>
<div class="tabs"><button id="ct" class="active">방 만들기</button><button id="jt">방 참가</button></div>
<div id="cf" class="form"><input id="cn" maxlength="10" placeholder="방장 닉네임"><button id="cb" class="btn primary">4자리 방 생성</button></div>
<div id="jf" class="form hidden"><input id="jn" maxlength="10" placeholder="참가자 닉네임"><input id="jc" maxlength="4" inputmode="numeric" placeholder="방 코드 4자리"><button id="jb" class="btn primary">방 참가</button></div>
<div id="net" class="notice">인터넷 연결 확인 중...</div>
</section>

<div id="game" class="hidden">
<header class="panel top"><div><h2>⚔️ 애니멀 배틀 GP</h2><small>온라인 P2P · 최대 6명 · 1,800m 원랩</small></div><div class="badges"><div class="badge">방 <span id="topCode">----</span></div><div class="badge">경기 <span id="round">1</span>/10</div><div class="badge">LAP <span id="topLap">0</span>/1</div></div></header>
<main class="layout">
<section class="panel racebox"><div id="arena" class="arena"><canvas id="glCanvas" aria-label="3D 동물 레이싱 경기장"></canvas><div class="track"></div><div class="center"><div><h2>AMAZON GRAND LOOP</h2><div id="comment" class="comment">참가자를 기다리는 중</div></div></div><div id="lap" class="lap">LAP 0 / 1</div></div></section>
<aside class="panel side">
<div style="display:flex;justify-content:space-between;align-items:center"><div><b>방 코드</b><div id="code" class="code">0000</div></div><button id="leave" class="btn secondary">나가기</button></div>
<div class="room-actions"><button id="share" class="btn primary">초대 링크 공유</button><button id="copyCode" class="btn secondary">코드 복사</button></div>
<div id="players" class="players"></div>
<div class="predict"><h3>내 예측</h3><div class="grid"><select id="p1"></select><select id="p2"></select><select id="p3"></select></div><input id="bet" type="number" min="0" step="10" value="50" style="margin-top:7px" placeholder="베팅 코인"><div class="money-actions"><button id="allin" class="btn primary">🔥 올인</button><button id="loan" class="btn secondary">🏦 긴급대출 +200</button></div><div style="margin-top:6px;font-weight:900">보유 <span id="coins">300</span>코인 · 빚 <span id="debt">0</span>코인</div><div class="loan-note">100코인 이하일 때 최대 2회 · 200코인 수령, 250코인 상환</div><div class="actions"><button id="ready" class="btn primary">예측·베팅 확정</button><button id="start" class="btn primary hidden">방장: 경기 시작</button></div></div>
<div id="status" class="status">연결 중...</div><div class="board"><b>실시간 순위</b><div id="board"></div></div>
</aside></main></div></div>

<div id="overlay" class="overlay"><div class="result"><h2 id="resultTitle">🏆 경기 결과</h2><div id="result"></div><button id="next" class="btn primary" style="width:100%;margin-top:10px">다음 경기</button></div></div>

<script src="./assets/vendor/three.bundle.js"></script>
<script src="./assets/vendor/trystero.bundle.js"></script>
<script>
const THREE=globalThis.THREE;
const joinRoom=globalThis.Trystero?.joinRoom;

const A=[
 ["번개 토끼","./assets/photoreal-characters-v2/rabbit.png","#ff70a8"],
 ["황금 치타","./assets/photoreal-characters-v2/cheetah.png","#e3a225"],
 ["붉은 여우","./assets/photoreal-characters-v2/fox.png","#df5b32"],
 ["야생마","./assets/photoreal-characters-v2/horse.png","#9b6334"],
 ["질주견","./assets/photoreal-characters-v2/dog.png","#4387ff"],
 ["파워 판다","./assets/photoreal-characters-v2/panda.png","#48535d"]
];
const animalIcon=a=>`<img class="inline-sprite" src="${a[1]}" alt="" aria-hidden="true">`;
const $=x=>document.getElementById(x),uid=()=>crypto.randomUUID(),esc=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
let room=null,roomCode="",myId=uid(),host=false,state=null,actions={},timer=null,lastFrame=0,seenResult=0,lastStateVersion=0,currentRaceId="";
const config={appId:"animal-battle-gp-public-v3"};
const PUBLIC_GAME_URL="https://onesun-arch.github.io/animal-battle-gp-3d/";
const invitedCode=new URLSearchParams(location.search).get("room")||"";
const GL={renderer:null,scene:null,camera:null,racers:[],targets:[],targetRotations:[],trackCurve:null,ready:false};

function ribbonGeometry(curve,width,segments=360){
 const positions=[],uvs=[],indices=[],side=new THREE.Vector3();
 for(let i=0;i<=segments;i++){
   const u=i/segments,p=curve.getPointAt(u),tangent=curve.getTangentAt(u).normalize();
   side.set(-tangent.z,0,tangent.x).normalize();
   [-1,1].forEach((sign,n)=>{const q=p.clone().addScaledVector(side,sign*width*.5);positions.push(q.x,q.y,q.z);uvs.push(n,u*18)})
 }
 for(let i=0;i<segments;i++){const a=i*2,b=a+1,c=a+2,d=a+3;indices.push(a,c,b,b,c,d)}
 const geometry=new THREE.BufferGeometry();
 geometry.setAttribute("position",new THREE.Float32BufferAttribute(positions,3));
 geometry.setAttribute("uv",new THREE.Float32BufferAttribute(uvs,2));
 geometry.setIndex(indices);geometry.computeVertexNormals();return geometry
}
function offsetCurve(curve,offset,samples=260){
 const side=new THREE.Vector3(),points=Array.from({length:samples},(_,i)=>{
   const u=i/samples,p=curve.getPointAt(u),tangent=curve.getTangentAt(u).normalize();
   return p.addScaledVector(side.set(-tangent.z,0,tangent.x).normalize(),offset)
 });
 return new THREE.CatmullRomCurve3(points,true,"catmullrom",.45)
}
async function init3D(){
 try{
   const canvas=$("glCanvas"),arena=$("arena");
   const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:"high-performance"});
   renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
   renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.08;
   const scene=new THREE.Scene();scene.background=new THREE.Color(0x55745a);scene.fog=new THREE.Fog(0x55745a,18,40);
   const camera=new THREE.PerspectiveCamera(58,1,.1,70);camera.position.set(9,5.4,11.5);camera.lookAt(0,.65,2.8);
   scene.add(new THREE.HemisphereLight(0xe8f5dc,0x243718,2.5));
   const sun=new THREE.DirectionalLight(0xffd38a,4.4);sun.position.set(-9,14,7);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-22;sun.shadow.camera.right=22;sun.shadow.camera.top=18;sun.shadow.camera.bottom=-18;scene.add(sun);
   const skyFill=new THREE.DirectionalLight(0x9ed7ff,1.1);skyFill.position.set(10,8,-12);scene.add(skyFill);
   const loader=new THREE.TextureLoader();
   const [jungle,grass,dirt,...animals]=await Promise.all([
     loader.loadAsync("./assets/amazon-race-arena.png"),
     loader.loadAsync("./assets/textures/grass-tile.jpg"),
     loader.loadAsync("./assets/textures/dirt-tile.jpg"),
     ...A.map(a=>loader.loadAsync(a[1]))
   ]);
   [jungle,grass,dirt,...animals].forEach(t=>t.colorSpace=THREE.SRGBColorSpace);
   jungle.mapping=THREE.EquirectangularReflectionMapping;scene.background=jungle;scene.environment=jungle;scene.backgroundBlurriness=.04;scene.fog.color.set(0x55745a);
   const maxAnisotropy=renderer.capabilities.getMaxAnisotropy();grass.anisotropy=dirt.anisotropy=maxAnisotropy;
   grass.wrapS=grass.wrapT=THREE.RepeatWrapping;grass.repeat.set(7,5);
   dirt.wrapS=dirt.wrapT=THREE.RepeatWrapping;dirt.repeat.set(5,3);
   const ground=new THREE.Mesh(new THREE.PlaneGeometry(38,25),new THREE.MeshStandardMaterial({map:grass,roughness:1,color:0x678e44}));
   ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
   const trackCurve=new THREE.CatmullRomCurve3([
     new THREE.Vector3(-11,.18,5.8),new THREE.Vector3(-6,.65,9),new THREE.Vector3(2,1.05,8),
     new THREE.Vector3(10,.35,6.2),new THREE.Vector3(14,.15,0),new THREE.Vector3(10,.85,-7),
     new THREE.Vector3(2,.25,-9),new THREE.Vector3(-5,.95,-7),new THREE.Vector3(-13,.2,-3),
     new THREE.Vector3(-15,.45,2)
   ],true,"catmullrom",.42);
   GL.trackCurve=trackCurve;
   const track=new THREE.Mesh(ribbonGeometry(trackCurve,5.8),new THREE.MeshStandardMaterial({map:dirt,roughness:.94,color:0xc47a3d}));
   track.position.y=.045;track.receiveShadow=true;scene.add(track);
   const curbMaterial=new THREE.MeshStandardMaterial({color:0xf1ca5b,roughness:.7});
   [-3,3].forEach(offset=>{const curb=new THREE.Mesh(new THREE.TubeGeometry(offsetCurve(trackCurve,offset),300,.14,8,true),curbMaterial);curb.position.y=.1;curb.castShadow=true;scene.add(curb)});
   const centerLine=new THREE.Mesh(new THREE.TubeGeometry(trackCurve,340,.035,6,true),new THREE.MeshBasicMaterial({color:0xffefad,transparent:true,opacity:.72}));
   centerLine.position.y=.12;scene.add(centerLine);
   const river=new THREE.Mesh(new THREE.PlaneGeometry(9.8,1.15),new THREE.MeshStandardMaterial({color:0x258cb4,metalness:.25,roughness:.18,transparent:true,opacity:.88}));
   river.rotation.x=-Math.PI/2;river.position.set(0,.085,0);scene.add(river);
   const boostMaterial=new THREE.MeshStandardMaterial({color:0x27e4cf,emissive:0x087c72,emissiveIntensity:1.7,metalness:.25,roughness:.3});
   [.14,.48,.78].forEach(u=>{const p=trackCurve.getPointAt(u),tangent=trackCurve.getTangentAt(u),pad=new THREE.Mesh(new THREE.BoxGeometry(4.5,.045,1.25),boostMaterial);pad.position.copy(p);pad.position.y+=.13;pad.rotation.y=Math.atan2(tangent.x,tangent.z);scene.add(pad)});
   const trunkGeometry=new THREE.CylinderGeometry(.28,.48,3.8,10);
   const trunkMaterial=new THREE.MeshStandardMaterial({color:0x5b371e,roughness:1});
   const leafGeometry=new THREE.IcosahedronGeometry(1.35,1);
   const leafMaterial=new THREE.MeshStandardMaterial({color:0x145f35,roughness:.9});
   [[-15.5,7,1.45],[15.5,7,1.45],[-16,0,1.7],[16,0,1.7],[-15,-7,1.55],[15,-7,1.55],[-4.5,1.7,1.05],[4.5,-1.7,1.05]].forEach(([x,z,s],i)=>{
     const trunk=new THREE.Mesh(trunkGeometry,trunkMaterial);trunk.position.set(x,1.9*s,z);trunk.scale.setScalar(s);trunk.castShadow=true;scene.add(trunk);
     for(let n=0;n<3;n++){const leaf=new THREE.Mesh(leafGeometry,leafMaterial);leaf.position.set(x+(n-1)*.9*s,4.4*s+Math.abs(n-1)*.25,z+(i%2?.35:-.35));leaf.scale.set(1.25*s,.78*s,1.1*s);leaf.castShadow=true;scene.add(leaf)}
   });
   const rockMaterial=new THREE.MeshStandardMaterial({color:0x57625a,roughness:.96});
   [[-14,3,.8],[14,-3,1],[-9.5,-8,.75],[9.5,8,.9],[-4.8,-1.8,.55],[4.9,1.7,.6]].forEach(([x,z,s])=>{const rock=new THREE.Mesh(new THREE.DodecahedronGeometry(s,0),rockMaterial);rock.position.set(x,s*.55,z);rock.scale.y=.7;rock.rotation.set(.2,x*.1,.12);rock.castShadow=true;scene.add(rock)});
   const archMaterial=new THREE.MeshStandardMaterial({color:0x68411f,roughness:.82});
   const startPoint=trackCurve.getPointAt(0),startTangent=trackCurve.getTangentAt(0).normalize(),startSide=new THREE.Vector3(-startTangent.z,0,startTangent.x).normalize();

   const arch=new THREE.Mesh(new THREE.BoxGeometry(6.7,.48,.55),archMaterial);arch.position.copy(startPoint);arch.position.y+=4.7;arch.rotation.y=Math.atan2(-startSide.z,startSide.x);arch.castShadow=true;scene.add(arch);
   animals.forEach((texture,i)=>{
     const kart=new THREE.Group(),paint=new THREE.Color(A[i][2]),bodyMaterial=new THREE.MeshPhysicalMaterial({color:paint,metalness:.64,roughness:.2,clearcoat:1,clearcoatRoughness:.12});
     const body=new THREE.Mesh(new THREE.SphereGeometry(1,28,14),bodyMaterial);body.scale.set(.76,.25,1.05);body.position.y=.42;body.castShadow=true;kart.add(body);
     const nose=new THREE.Mesh(new THREE.SphereGeometry(1,24,12),bodyMaterial);nose.scale.set(.61,.22,.58);nose.position.set(0,.47,.72);nose.castShadow=true;kart.add(nose);
     const seatMaterial=new THREE.MeshStandardMaterial({color:0x111715,metalness:.05,roughness:.62});
     const seat=new THREE.Mesh(new THREE.SphereGeometry(1,20,12),seatMaterial);seat.scale.set(.39,.52,.24);seat.position.set(0,.75,-.38);seat.rotation.x=-.2;seat.castShadow=true;kart.add(seat);
     const wheelMaterial=new THREE.MeshStandardMaterial({color:0x090b0a,metalness:.08,roughness:.88}),rimMaterial=new THREE.MeshStandardMaterial({color:0xaeb9b4,metalness:.92,roughness:.18}),wheels=[];
     [[-.76,.27,.55],[.76,.27,.55],[-.76,.27,-.55],[.76,.27,-.55]].forEach(([x,y,z])=>{const wheel=new THREE.Mesh(new THREE.CylinderGeometry(.29,.29,.24,20),wheelMaterial);wheel.position.set(x,y,z);wheel.rotation.z=Math.PI/2;wheel.castShadow=true;kart.add(wheel);const rim=new THREE.Mesh(new THREE.CylinderGeometry(.13,.13,.255,16),rimMaterial);rim.position.copy(wheel.position);rim.rotation.z=Math.PI/2;kart.add(rim);wheels.push(wheel)});
     const bumperMaterial=new THREE.MeshStandardMaterial({color:0xe8eee9,metalness:.88,roughness:.2});
     const bumper=new THREE.Mesh(new THREE.BoxGeometry(1.58,.1,.14),bumperMaterial);bumper.position.set(0,.29,1.13);bumper.castShadow=true;kart.add(bumper);
     const spoiler=new THREE.Mesh(new THREE.BoxGeometry(1.42,.09,.28),bodyMaterial);spoiler.position.set(0,.72,-1.02);spoiler.castShadow=true;kart.add(spoiler);
     const steering=new THREE.Mesh(new THREE.TorusGeometry(.21,.035,10,24),new THREE.MeshStandardMaterial({color:0x141817,metalness:.55,roughness:.32}));steering.position.set(0,1.02,.15);steering.rotation.x=-1.05;kart.add(steering);
     [-.32,.32].forEach(x=>{const lamp=new THREE.Mesh(new THREE.SphereGeometry(.09,12,8),new THREE.MeshStandardMaterial({color:0xfff2c0,emissive:0xffd36a,emissiveIntensity:2.2,roughness:.12}));lamp.scale.z=.45;lamp.position.set(x,.52,1.17);kart.add(lamp)});
     const contactShadow=new THREE.Mesh(new THREE.CircleGeometry(.92,28),new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:.28,depthWrite:false}));contactShadow.rotation.x=-Math.PI/2;contactShadow.scale.set(1,1.35,1);contactShadow.position.y=.055;kart.add(contactShadow);

 $("board").innerHTML=r.order.map((i,k)=>{const v=r.progress.find(x=>x.i===i).v;return`<div class="rank"><b>${k+1}</b><div>${animalIcon(A[i])}${A[i][0]}<div class="bar"><i style="width:${v*100}%"></i></div></div><span>${Math.floor(v*1800)}m</span></div>`}).join("")
}
function showResult(res){
 seenResult=res.version;$("overlay").classList.add("show");$("resultTitle").textContent=res.final?"🏆 최종 순위 발표":"🏁 경기 결과";$("next").textContent=host?(res.final?"새 게임 시작":"다음 경기"):"방장을 기다리는 중";$("next").disabled=!host;
 if(res.final){
   const ranking=res.finalRanking||[],last=ranking.find(p=>p.id===res.lastId);
   $("result").innerHTML=`<div class="status">${res.finalReason||"게임 종료"} · 보유 코인에서 대출 상환액을 뺀 순자산 기준</div><table><tr><th>최종 순위</th><th>이름</th><th>상태</th><th>보유 코인</th><th>빚</th><th>순자산</th><th>누적 점수</th></tr>${ranking.map((p,i)=>`<tr class="${p.id===res.lastId?"last":i===0?"win":""}"><td>${i===0?"🥇 ":i===1?"🥈 ":i===2?"🥉 ":""}${i+1}위</td><td>${esc(p.name)}</td><td>${p.eliminated?`${p.eliminatedRound}경기 탈락`:"생존"}</td><td>${p.coins}</td><td>${p.debt||0}</td><td>${p.net}</td><td>${p.total}</td></tr>`).join("")}</table><div class="penalty">💀 최종 꼴찌: ${last?esc(last.name):"없음"}<br>🎯 벌칙: ${res.penalty}</div>`;
   return
 }
 const sorted=[...res.rows].sort((a,b)=>b.score.exact-a.score.exact||b.points-a.points);
 $("result").innerHTML=`<p><b>실제 TOP3:</b> ${res.actual.slice(0,3).map((i,k)=>`${k+1}위 ${animalIcon(A[i])} ${A[i][0]}`).join(" · ")}</p><table><tr><th>순위</th><th>이름</th><th>정확 적중</th><th>점수</th><th>코인</th></tr>${sorted.map((r,i)=>`<tr class="${res.winnerIds.includes(r.id)?"win":""}"><td>${i+1}</td><td>${esc(r.name)}</td><td>${r.score.exact}</td><td>${r.points}</td><td>${res.winnerIds.includes(r.id)?`+${res.share}`:`-${r.bet}`}</td></tr>`).join("")}</table><div class="status">배수 ${res.mu}배 · 총 상금 ${res.prize}코인 · 우승자 1인당 ${res.share}코인</div>${res.newlyEliminated?.length?`<div class="penalty">💀 코인 0 탈락: ${state.players.filter(p=>res.newlyEliminated.includes(p.id)).map(p=>esc(p.name)).join(", ")}</div>`:""}`
}
