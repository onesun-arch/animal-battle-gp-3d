<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>동물 레이싱 배틀 GP</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Noto Sans KR",sans-serif;background:#17251c url("./assets/amazon-race-arena.png") center/cover fixed;min-height:100vh;color:#183426}
body:before{content:"";position:fixed;inset:0;background:linear-gradient(135deg,#07130bd9,#12361f70 55%,#7045164d);backdrop-filter:blur(8px);z-index:-1}
button,input,select{font:inherit}.hidden{display:none!important}.wrap{max-width:1300px;margin:auto;padding:12px}
.panel{background:#fffffff0;border:1px solid #ffffff80;border-radius:22px;box-shadow:0 22px 70px #07130b70;backdrop-filter:blur(16px)}.lobby{max-width:650px;margin:7vh auto;padding:28px}
h1,h2,h3{margin-top:0}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:15px 0}.tabs button,.btn{border:0;border-radius:13px;padding:12px;font-weight:900;cursor:pointer}.tabs .active,.btn.primary{background:linear-gradient(135deg,#1d7e48,#d18b2e);color:white;box-shadow:0 8px 22px #225e3440}.btn.secondary{background:#edf3ef;color:#173f2b}.form{display:grid;gap:10px}.form input{width:100%;padding:12px;border:1px solid #bfd2c6;border-radius:11px;background:#ffffffdd}.notice{margin-top:13px;padding:11px;border-radius:12px;background:#edf7f0;font-size:13px;line-height:1.5}
.top{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;margin-bottom:10px}.badges{display:flex;gap:7px;flex-wrap:wrap}.badge{padding:8px 10px;background:#fff;border:1px solid #d8e6ee;border-radius:11px;font-weight:900}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:11px}.racebox{padding:11px}.arena{height:690px;position:relative;overflow:hidden;border-radius:18px;background:#315c2d url("./assets/amazon-race-arena.png") center/cover no-repeat;box-shadow:inset 0 0 55px #1f120466,0 20px 55px #07130b55}.arena canvas{position:absolute;inset:0;width:100%;height:100%;display:block}.arena:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,transparent 58%,#120a0338);box-shadow:inset 0 0 90px #07130b99;z-index:1}
.track{display:none}
.center{position:absolute;left:50%;top:17%;transform:translate(-50%,-50%);width:min(72%,620px);display:grid;place-items:center;text-align:center;color:#fff;text-shadow:0 3px 12px #071b0d;z-index:3;pointer-events:none}.center h2{letter-spacing:.22em;margin-bottom:8px}.comment{background:#123c2cdd;padding:9px 14px;border:1px solid #ffffff38;border-radius:999px;font-weight:900;font-size:13px;box-shadow:0 8px 22px #0005}
.lap{position:absolute;right:14px;top:14px;background:#10241ee8;color:#fff;padding:9px 12px;border-radius:12px;font-weight:1000;z-index:5}.racer{position:absolute;width:78px;height:78px;padding:4px;border-radius:50%;background:linear-gradient(145deg,#fff,#d9c295);border:3px solid var(--c);display:grid;place-items:center;transform:translate(-50%,-50%);transition:left .12s linear,top .12s linear;box-shadow:0 8px 18px #0008;z-index:4}.racer img{display:block;width:100%;height:100%;border-radius:50%;object-fit:cover;pointer-events:none}.racer.lead{box-shadow:0 0 0 5px #ffd45c,0 9px 25px #0008;animation:pulse .45s ease-in-out infinite alternate}.racer.sprint{animation:shake .12s linear infinite}@keyframes pulse{to{transform:translate(-50%,-50%) scale(1.12)}}@keyframes shake{50%{margin-left:4px}}
.side{padding:13px}.code{font-size:28px;letter-spacing:5px;font-weight:1000;color:#1e7b4b}.room-actions{display:flex;gap:6px;margin:8px 0 2px}.room-actions .btn{flex:1;padding:9px;font-size:13px}.players{display:grid;gap:6px;margin:10px 0}.player{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:8px;background:#fff;border:1px solid #d8e6ee;border-radius:12px;padding:8px}.player.me{border:2px solid #2b8a57}.player.eliminated{opacity:.55;background:#ececec;border-color:#aaa}.ready{color:#16924e;font-weight:900}.wait{color:#d57f15;font-weight:900}.out{color:#a52828;font-weight:1000}.predict{background:#fff;border:1px solid #d8e6ee;border-radius:14px;padding:10px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.grid select,.predict input{width:100%;padding:9px 5px;border:1px solid #c9dbe6;border-radius:9px}.money-actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:7px}.money-actions .btn{padding:9px;font-size:13px}.loan-note{font-size:11px;opacity:.68;margin-top:5px}.actions{display:grid;gap:7px;margin-top:9px}.status{margin-top:9px;padding:9px;border-radius:11px;background:#173c2c;color:#fff;font-size:13px;line-height:1.45}.board{margin-top:10px}.rank{display:grid;grid-template-columns:25px 1fr auto;gap:6px;background:#fff;margin-top:4px;padding:7px;border-radius:10px}.bar{height:6px;background:#e5eef3;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#2e9b5c,#d18b2e)}.inline-sprite{width:36px;height:36px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:4px;border:2px solid #fff;box-shadow:0 2px 7px #0003}
.overlay{position:fixed;inset:0;background:#071522e9;display:none;align-items:center;justify-content:center;padding:14px;z-index:999}.overlay.show{display:flex}.result{background:#fff;border-radius:20px;padding:18px;width:min(860px,96vw);max-height:92vh;overflow:auto}.result table{width:100%;border-collapse:collapse}.result th,.result td{padding:8px;border-bottom:1px solid #e1e9ee;text-align:center;font-size:13px}.win{background:#fff6cf}.last{background:#ffe1df}.penalty{background:#fff0ef;border-radius:11px;padding:10px;margin-top:10px;font-weight:900;color:#8b2723}
@media(max-width:900px){.layout{grid-template-columns:1fr}.arena{height:520px}}@media(max-width:600px){.wrap{padding:6px}.arena{height:450px}.racer{width:54px;height:54px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<section id="lobby" class="panel lobby">
<h1>🏁 온라인 애니멀 배틀 GP</h1>
<p>초대 링크나 4자리 방 코드로 최대 6명이 실시간 함께 플레이합니다.</p>
<div class="tabs"><button id="ct" class="active">방 만들기</button><button id="jt">방 참가</button></div>
<div id="cf" class="form"><input id="cn" maxlength="10" placeholder="방장 닉네임"><button id="cb" class="btn primary">4자리 방 생성</button></div>
<div id="jf" class="form hidden"><input id="jn" maxlength="10" placeholder="참가자 닉네임"><input id="jc" maxlength="4" inputmode="numeric" placeholder="방 코드 4자리"><button id="jb" class="btn primary">방 참가</button></div>
<div id="net" class="notice">인터넷 연결 확인 중...</div>
</section>

<div id="game" class="hidden">
<header class="panel top"><div><h2>⚔️ 애니멀 배틀 GP</h2><small>온라인 P2P · 최대 6명</small></div><div class="badges"><div class="badge">방 <span id="topCode">----</span></div><div class="badge">경기 <span id="round">1</span>/10</div><div class="badge">LAP <span id="topLap">0</span>/4</div></div></header>
<main class="layout">
<section class="panel racebox"><div id="arena" class="arena"><canvas id="glCanvas" aria-label="3D 동물 레이싱 경기장"></canvas><div class="track"></div><div class="center"><div><h2>BATTLE GP</h2><div id="comment" class="comment">참가자를 기다리는 중</div></div></div><div id="lap" class="lap">LAP 0 / 4</div></div></section>
<aside class="panel side">
<div style="display:flex;justify-content:space-between;align-items:center"><div><b>방 코드</b><div id="code" class="code">0000</div></div><button id="leave" class="btn secondary">나가기</button></div>
<div class="room-actions"><button id="share" class="btn primary">초대 링크 공유</button><button id="copyCode" class="btn secondary">코드 복사</button></div>
<div id="players" class="players"></div>
<div class="predict"><h3>내 예측</h3><div class="grid"><select id="p1"></select><select id="p2"></select><select id="p3"></select></div><input id="bet" type="number" min="0" step="10" value="50" style="margin-top:7px" placeholder="베팅 코인"><div class="money-actions"><button id="allin" class="btn primary">🔥 올인</button><button id="loan" class="btn secondary">🏦 긴급대출 +200</button></div><div style="margin-top:6px;font-weight:900">보유 <span id="coins">300</span>코인 · 빚 <span id="debt">0</span>코인</div><div class="loan-note">100코인 이하일 때 최대 2회 · 200코인 수령, 250코인 상환</div><div class="actions"><button id="ready" class="btn primary">예측·베팅 확정</button><button id="start" class="btn primary hidden">방장: 경기 시작</button></div></div>
<div id="status" class="status">연결 중...</div><div class="board"><b>실시간 순위</b><div id="board"></div></div>
</aside></main></div></div>

<div id="overlay" class="overlay"><div class="result"><h2 id="resultTitle">🏆 경기 결과</h2><div id="result"></div><button id="next" class="btn primary" style="width:100%;margin-top:10px">다음 경기</button></div></div>

<script src="./assets/vendor/three.bundle.js"></script>
<script src="./assets/vendor/trystero.bundle.js"></script>
<script>
const THREE=globalThis.THREE;
const joinRoom=globalThis.Trystero?.joinRoom;

const A=[
 ["번개 토끼","./assets/realistic-characters-3d/rabbit.png","#ff70a8"],
 ["황금 치타","./assets/realistic-characters-3d/cheetah.png","#e3a225"],
 ["붉은 여우","./assets/realistic-characters-3d/fox.png","#df5b32"],
 ["야생마","./assets/realistic-characters-3d/horse.png","#9b6334"],
 ["질주견","./assets/realistic-characters-3d/dog.png","#4387ff"],
 ["파워 판다","./assets/realistic-characters-3d/panda.png","#48535d"]
];
const animalIcon=a=>`<img class="inline-sprite" src="${a[1]}" alt="" aria-hidden="true">`;
const $=x=>document.getElementById(x),uid=()=>crypto.randomUUID(),esc=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
let room=null,roomCode="",myId=uid(),host=false,state=null,actions={},timer=null,lastFrame=0,seenResult=0,lastStateVersion=0,currentRaceId="";
const config={appId:"animal-battle-gp-public-v3"};
const PUBLIC_GAME_URL="https://onesun-arch.github.io/animal-battle-gp-3d/";
const invitedCode=new URLSearchParams(location.search).get("room")||"";
const GL={renderer:null,scene:null,camera:null,racers:[],targets:[],targetRotations:[],ready:false};

function ellipseRing(outerX,outerY,innerX,innerY){
 const shape=new THREE.Shape();
 shape.absellipse(0,0,outerX,outerY,0,Math.PI*2,false,0);
 const hole=new THREE.Path();
 hole.absellipse(0,0,innerX,innerY,0,Math.PI*2,true,0);
 shape.holes.push(hole);
 return new THREE.ShapeGeometry(shape,96);
}
function ellipseLine(rx,rz,color,opacity=.8){
 const points=Array.from({length:160},(_,i)=>{const t=i/160*Math.PI*2;return new THREE.Vector3(Math.cos(t)*rx,.075,Math.sin(t)*rz)});
 const geometry=new THREE.BufferGeometry().setFromPoints(points);
 const material=new THREE.LineDashedMaterial({color,transparent:true,opacity,dashSize:.18,gapSize:.16});
 const line=new THREE.LineLoop(geometry,material);line.computeLineDistances();return line
}
async function init3D(){
 try{
   const canvas=$("glCanvas"),arena=$("arena");
   const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:"high-performance"});
   renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
   renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.16;
   const scene=new THREE.Scene();scene.background=new THREE.Color(0x55745a);scene.fog=new THREE.Fog(0x55745a,18,40);
   const camera=new THREE.PerspectiveCamera(58,1,.1,70);camera.position.set(9,5.4,11.5);camera.lookAt(0,.65,2.8);
   scene.add(new THREE.HemisphereLight(0xe8f5dc,0x243718,2.5));
   const sun=new THREE.DirectionalLight(0xffd38a,4.4);sun.position.set(-9,14,7);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
   const loader=new THREE.TextureLoader();
   const [jungle,grass,dirt,...animals]=await Promise.all([
     loader.loadAsync("./assets/amazon-race-arena.png"),
     loader.loadAsync("./assets/textures/grass-tile.jpg"),
     loader.loadAsync("./assets/textures/dirt-tile.jpg"),
     ...A.map(a=>loader.loadAsync(a[1]))
   ]);
   [jungle,grass,dirt,...animals].forEach(t=>t.colorSpace=THREE.SRGBColorSpace);
   scene.background=jungle;scene.backgroundBlurriness=.08;scene.fog.color.set(0x55745a);
   grass.wrapS=grass.wrapT=THREE.RepeatWrapping;grass.repeat.set(7,5);
   dirt.wrapS=dirt.wrapT=THREE.RepeatWrapping;dirt.repeat.set(5,3);
   const ground=new THREE.Mesh(new THREE.PlaneGeometry(27,19),new THREE.MeshStandardMaterial({map:grass,roughness:1,color:0x678e44}));
   ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
   const track=new THREE.Mesh(ellipseRing(8.6,5.25,3.65,1.75),new THREE.MeshStandardMaterial({map:dirt,roughness:.94,color:0xc47a3d}));
   track.rotation.x=-Math.PI/2;track.position.y=.045;track.receiveShadow=true;scene.add(track);
   const curbMaterial=new THREE.MeshStandardMaterial({color:0xf1ca5b,roughness:.7});
   const outerCurb=new THREE.Mesh(ellipseRing(8.85,5.5,8.52,5.17),curbMaterial);
   const innerCurb=new THREE.Mesh(ellipseRing(3.93,2.03,3.57,1.67),curbMaterial);
   [outerCurb,innerCurb].forEach(m=>{m.rotation.x=-Math.PI/2;m.position.y=.075;m.castShadow=true;m.receiveShadow=true;scene.add(m)});
   scene.add(ellipseLine(6.1,3.5,0xffefad,.72));
   const infield=new THREE.Mesh(new THREE.CircleGeometry(1,96),new THREE.MeshStandardMaterial({map:grass,roughness:1,color:0x4f873d}));
   infield.rotation.x=-Math.PI/2;infield.scale.set(3.55,1.66,1);infield.position.y=.06;infield.receiveShadow=true;scene.add(infield);
   const trunkGeometry=new THREE.CylinderGeometry(.28,.48,3.8,10);
   const trunkMaterial=new THREE.MeshStandardMaterial({color:0x5b371e,roughness:1});
   const leafGeometry=new THREE.IcosahedronGeometry(1.35,1);
   const leafMaterial=new THREE.MeshStandardMaterial({color:0x145f35,roughness:.9});
   [[-10.8,6,1.35],[10.8,6,1.35],[-11.5,0,1.55],[11.5,0,1.55],[-10.6,-6,1.45],[10.6,-6,1.45],[-2.8,0,1.05],[2.8,0,1.05]].forEach(([x,z,s],i)=>{
     const trunk=new THREE.Mesh(trunkGeometry,trunkMaterial);trunk.position.set(x,1.9*s,z);trunk.scale.setScalar(s);trunk.castShadow=true;scene.add(trunk);
     for(let n=0;n<3;n++){const leaf=new THREE.Mesh(leafGeometry,leafMaterial);leaf.position.set(x+(n-1)*.9*s,4.4*s+Math.abs(n-1)*.25,z+(i%2?.35:-.35));leaf.scale.set(1.25*s,.78*s,1.1*s);leaf.castShadow=true;scene.add(leaf)}
   });
   const archMaterial=new THREE.MeshStandardMaterial({color:0x68411f,roughness:.82});
   [1.3,5.7].forEach(z=>{const pillar=new THREE.Mesh(new THREE.CylinderGeometry(.25,.38,4.8,10),archMaterial);pillar.position.set(0,2.4,z);pillar.castShadow=true;scene.add(pillar)});
   const arch=new THREE.Mesh(new THREE.BoxGeometry(.55,.48,4.8),archMaterial);arch.position.set(0,4.7,3.5);arch.castShadow=true;scene.add(arch);
   animals.forEach((texture,i)=>{
     const kart=new THREE.Group(),bodyMaterial=new THREE.MeshStandardMaterial({color:new THREE.Color(A[i][2]),metalness:.18,roughness:.42});
     const body=new THREE.Mesh(new THREE.BoxGeometry(1.35,.34,1.65),bodyMaterial);body.position.y=.38;body.castShadow=true;kart.add(body);
     const nose=new THREE.Mesh(new THREE.BoxGeometry(1.05,.28,.65),bodyMaterial);nose.position.set(0,.43,.83);nose.castShadow=true;kart.add(nose);
     const seat=new THREE.Mesh(new THREE.BoxGeometry(.68,.72,.34),new THREE.MeshStandardMaterial({color:0x1b2421,roughness:.75}));seat.position.set(0,.78,-.32);seat.rotation.x=-.18;kart.add(seat);
     const wheelMaterial=new THREE.MeshStandardMaterial({color:0x101312,roughness:.9}),wheels=[];
     [[-.72,.25,.52],[.72,.25,.52],[-.72,.25,-.53],[.72,.25,-.53]].forEach(([x,y,z])=>{const wheel=new THREE.Mesh(new THREE.CylinderGeometry(.27,.27,.22,14),wheelMaterial);wheel.position.set(x,y,z);wheel.rotation.z=Math.PI/2;wheel.castShadow=true;kart.add(wheel);wheels.push(wheel)});
     const bumper=new THREE.Mesh(new THREE.BoxGeometry(1.52,.12,.16),new THREE.MeshStandardMaterial({color:0xf3e6bc,metalness:.35,roughness:.4}));bumper.position.set(0,.28,1.14);kart.add(bumper);
     const material=new THREE.SpriteMaterial({map:texture,transparent:true,alphaTest:.025,depthWrite:false});
     const rider=new THREE.Sprite(material);rider.position.set(0,1.42,-.18);rider.scale.set(1.18,1.18,1);rider.renderOrder=5;kart.add(rider);
     kart.userData.wheels=wheels;kart.visible=false;kart.renderOrder=4;scene.add(kart);
     GL.racers[i]=kart;GL.targets[i]=new THREE.Vector3();GL.targetRotations[i]=0
   });
   GL.renderer=renderer;GL.scene=scene;GL.camera=camera;GL.ready=true;
   if(state?.race)renderRace(state.race);else showStartingGrid();
   const resize=()=>{const w=Math.max(1,arena.clientWidth),h=Math.max(1,arena.clientHeight),portrait=w/h<.95;renderer.setSize(w,h,false);camera.aspect=w/h;camera.fov=portrait?72:58;camera.updateProjectionMatrix()};
   new ResizeObserver(resize).observe(arena);resize();
   renderer.setAnimationLoop(time=>{
     GL.racers.forEach((kart,i)=>{if(!kart.visible)return;kart.position.lerp(GL.targets[i],.2);kart.position.y=GL.targets[i].y+Math.sin(time*.012+i)*.025;const delta=Math.atan2(Math.sin(GL.targetRotations[i]-kart.rotation.y),Math.cos(GL.targetRotations[i]-kart.rotation.y));kart.rotation.y+=delta*.18;kart.userData.wheels?.forEach(w=>w.rotation.x-=.22)});
     if(state?.running&&state.race){
       const leaderIndex=state.race.order?.[0]??0,leader=GL.racers[leaderIndex],target=GL.targets[leaderIndex],angle=GL.targetRotations[leaderIndex],dx=Math.sin(angle),dz=Math.cos(angle);
       const desired=new THREE.Vector3(target.x-dx*5.8,4.5,target.z-dz*5.8);camera.position.lerp(desired,.065);
       const visible=GL.racers.filter(k=>k.visible),focus=visible.reduce((v,k)=>v.add(k.position),new THREE.Vector3()).multiplyScalar(1/Math.max(1,visible.length));camera.lookAt(focus.x,.78,focus.z)
     }else{camera.position.lerp(new THREE.Vector3(9,5.4,11.5),.055);camera.lookAt(0,.7,2.8)}
     renderer.render(scene,camera)
   });
 }catch(error){
   console.error("WebGL initialization failed",error);$("glCanvas").classList.add("hidden");$("net").textContent="⚠️ 이 브라우저에서는 3D 하드웨어 가속을 시작할 수 없습니다."
 }
}
function setRacer3D(i,v,l,isLead){
 if(!GL.ready)return;
 const laneOffset=(l-2.5)*.48,rx=6.1+laneOffset,rz=3.5+laneOffset*.55,t=v*8*Math.PI+Math.PI/2;
 const target=GL.targets[i];target.set(Math.cos(t)*rx,.16,Math.sin(t)*rz);
 const dx=-Math.sin(t)*rx,dz=Math.cos(t)*rz;GL.targetRotations[i]=Math.atan2(dx,dz);
 const kart=GL.racers[i];if(!kart.visible){kart.position.copy(target);kart.rotation.y=GL.targetRotations[i];kart.visible=true}
 kart.scale.setScalar(isLead?1.08:1)
}
function showStartingGrid(){if(!GL.ready)return;GL.racers.forEach((kart,i)=>{const row=Math.floor(i/2),side=i%2;GL.targets[i].set(2.15-row*1.65,.16,2.45+side*1.45);GL.targetRotations[i]=-Math.PI/2;kart.position.copy(GL.targets[i]);kart.rotation.y=GL.targetRotations[i];kart.scale.setScalar(1);kart.visible=true})}
function clear3DRacers(){GL.racers.forEach(r=>r.visible=false)}
init3D();

$("net").textContent="✅ 준비 완료 · 인터넷만 연결되어 있으면 다른 기기와 접속할 수 있습니다.";
["p1","p2","p3"].forEach((id,n)=>$(id).innerHTML=`<option value="">${n+1}위 선택</option>`+A.map((a,i)=>`<option value="${i}">${a[0]}</option>`).join(""));
$("cn").value=localStorage.getItem("animal-gp-name")||"";
$("jn").value=localStorage.getItem("animal-gp-name")||"";

$("ct").onclick=()=>{$("ct").classList.add("active");$("jt").classList.remove("active");$("cf").classList.remove("hidden");$("jf").classList.add("hidden")};
$("jt").onclick=()=>{$("jt").classList.add("active");$("ct").classList.remove("active");$("jf").classList.remove("hidden");$("cf").classList.add("hidden")};
if(/^\d{4}$/.test(invitedCode)){$("jt").click();$("jc").value=invitedCode;$("net").textContent=`🔗 ${invitedCode}번 방 초대를 받았습니다. 닉네임을 입력하고 참가하세요.`}
$("jc").oninput=e=>e.target.value=e.target.value.replace(/\D/g,"").slice(0,4);
$("bet").addEventListener("input",()=>{
 const available=Math.max(0,Math.floor(me()?.coins||0));
 let value=Math.floor(Number($("bet").value)||0);
 if(value<0)value=0;if(value>available)value=available;
 $("bet").value=value;$("bet").max=available;
});
$("bet").addEventListener("blur",()=>{
 const available=Math.max(0,Math.floor(me()?.coins||0));
 let value=Math.floor(Number($("bet").value)||0);
 $("bet").value=Math.min(available,Math.max(0,value));
});
$("cb").onclick=()=>{const n=$("cn").value.trim();if(!n)return alert("닉네임을 입력하세요.");connect(String(Math.floor(1000+Math.random()*9000)),n,true)};
$("jb").onclick=()=>{const n=$("jn").value.trim(),c=$("jc").value.trim();if(!n)return alert("닉네임을 입력하세요.");if(!/^\d{4}$/.test(c))return alert("4자리 코드를 입력하세요.");connect(c,n,false)};
$("ready").onclick=submitReady;$("start").onclick=startRace;$("next").onclick=nextRound;$("allin").onclick=()=>{const m=me();if(m&&!m.eliminated&&!m.ready&&!state?.running)$("bet").value=Math.max(0,Math.floor(m.coins))};$("loan").onclick=requestLoan;$("leave").onclick=()=>{room?.leave?.();location.href=location.pathname};
$("share").onclick=shareRoom;$("copyCode").onclick=()=>copyText(roomCode,"방 코드가 복사되었습니다.");

async function copyText(text,message){
 try{await navigator.clipboard.writeText(text);$("status").textContent=`✅ ${message}`}
 catch{prompt("아래 내용을 복사하세요.",text)}
}
async function shareRoom(){
 const url=new URL(PUBLIC_GAME_URL);url.searchParams.set("room",roomCode);
 const data={title:"애니멀 배틀 GP 초대",text:`${roomCode}번 방에서 같이 경기해요!`,url:url.href};
 try{if(navigator.share){await navigator.share(data)}else await copyText(url.href,"초대 링크가 복사되었습니다.")}
 catch(e){if(e?.name!=="AbortError")await copyText(url.href,"초대 링크가 복사되었습니다.")}
}
function player(name,isHost){return{id:myId,name,host:isHost,coins:300,debt:0,loans:0,total:0,ready:false,picks:[],bet:0,eliminated:false,eliminatedRound:null}}
function connect(code,name,isHost){
 if(!joinRoom)return alert("멀티플레이 모듈을 불러오지 못했습니다. 새로고침해 주세요.");
 roomCode=code;host=isHost;
 localStorage.setItem("animal-gp-name",name);
 const roomUrl=new URL(location.href);roomUrl.search="";roomUrl.searchParams.set("room",code);history.replaceState({},"",roomUrl);
 $("lobby").classList.add("hidden");$("game").classList.remove("hidden");$("code").textContent=code;$("topCode").textContent=code;
 room=joinRoom(config,"animal-"+code);
 actions.hello=room.makeAction("hello");actions.state=room.makeAction("state");actions.submit=room.makeAction("submit");actions.frame=room.makeAction("frame");actions.command=room.makeAction("command");
 actions.hello.onMessage=(d,{peerId})=>{
   if(host&&d.type==="join"){
     if(state.players.length>=6){actions.command.send({type:"reject",target:d.player.id},{target:peerId});return}
     if(!state.players.some(p=>p.id===d.player.id))state.players.push({...d.player,peerId});
     sendState();
   }else if(!host&&d.type==="host"){actions.hello.send({type:"join",player:player(name,false)})}
 };
 actions.state.onMessage=d=>{
   if(host||!d)return;
   const incomingVersion=Number(d.version||0);
   if(incomingVersion<lastStateVersion)return;
   lastStateVersion=incomingVersion;
   state=d;
   currentRaceId=d.race?.raceId||"";
   if(!d.result){$("overlay").classList.remove("show")}
   if(!d.race&&!d.running)resetTrack();
   render();
 };
 actions.submit.onMessage=d=>{if(host&&!state.running){const p=state.players.find(x=>x.id===d.id);if(!p||p.eliminated)return;if(d.data?.type==="loan"){if(grantLoan(p))sendState();return}const picks=d.data?.picks||[],bet=Math.floor(Number(d.data?.bet));if(picks.length===3&&new Set(picks).size===3&&Number.isFinite(bet)&&bet>=0&&bet<=p.coins){Object.assign(p,{picks,bet,ready:true});sendState()}}};
 actions.frame.onMessage=d=>{
   if(host||!state||!d)return;
   if(!state.running)return;
   if(d.raceId&&currentRaceId&&d.raceId!==currentRaceId)return;
   if(Number(d.round||0)!==Number(state.round||0))return;
   state.race=d;renderRace(d)
 };
 actions.command.onMessage=d=>{
   if(d.target&&d.target!==myId)return;
   if(d.type==="reject"){alert("방이 가득 찼습니다.");location.reload()}
   if(d.type==="next"&&!host){
     $("overlay").classList.remove("show");seenResult=Math.max(seenResult,Number(d.version||0));
     currentRaceId="";resetInputs();resetTrack();
     $("status").textContent="다음 경기 예측을 입력하세요.";
   }
 };
 room.onPeerJoin=peerId=>{if(host){actions.hello.send({type:"host"},{target:peerId});actions.state.send(state,{target:peerId})}};
 room.onPeerLeave=peerId=>{
   if(host&&state){const before=state.players.length;state.players=state.players.filter(p=>p.host||p.peerId!==peerId);if(state.players.length!==before)sendState()}
   else if(!host){$("status").textContent="방장 또는 참가자와 연결이 끊어졌습니다. 잠시 후 자동 재연결을 기다리는 중입니다."}
 };
 if(host){
   state={hostId:myId,round:1,running:false,players:[player(name,true)],race:null,result:null,version:1};lastStateVersion=1;
   setInterval(()=>{actions.hello.send({type:"host"});sendState()},2500);
 }else{
   state={hostId:null,round:1,running:false,players:[player(name,false)],race:null,result:null,version:0};lastStateVersion=0;
   const ask=setInterval(()=>actions.hello.send({type:"join",player:player(name,false)}),1800);
   setTimeout(()=>clearInterval(ask),15000);
 }
 render();
}
function sendState(){if(!host)return;state.version=Number(state.version||0)+1;lastStateVersion=state.version;actions.state.send(structuredClone(state));render()}
function me(){return state?.players.find(p=>p.id===myId)}
function activePlayers(){return state?.players.filter(p=>!p.eliminated)||[]}
function netWorth(p){return Math.floor(Number(p.coins||0)-Number(p.debt||0))}
function grantLoan(p){
 if(!p||p.eliminated||p.ready||state.running||p.coins>100||(p.loans||0)>=2)return false;
 p.coins+=200;p.debt=(p.debt||0)+250;p.loans=(p.loans||0)+1;return true
}
function requestLoan(){
 const m=me();if(!m)return;
 if(m.eliminated)return alert("탈락한 참가자는 대출을 받을 수 없습니다.");
 if(m.ready||state.running)return alert("경기 준비 전까지만 대출할 수 있습니다.");
 if(m.coins>100)return alert("보유 코인이 100 이하일 때만 긴급대출을 받을 수 있습니다.");
 if((m.loans||0)>=2)return alert("긴급대출은 최대 2회까지 가능합니다.");
 if(host){grantLoan(m);sendState()}else actions.submit.send({id:myId,data:{type:"loan"}})
}
function render(){
 if(!state)return;
 $("round").textContent=state.round;
 const m=me();if(m){
   $("coins").textContent=m.coins;
   $("debt").textContent=m.debt||0;
   $("bet").max=Math.max(0,Math.floor(m.coins));
   const entered=Math.floor(Number($("bet").value)||0);
   if(entered>m.coins)$("bet").value=Math.max(0,Math.floor(m.coins));
 }
 $("players").innerHTML=state.players.map((p,i)=>`<div class="player ${p.id===myId?"me":""} ${p.eliminated?"eliminated":""}"><b>${i+1}</b><div><b>${esc(p.name)}</b>${p.host?" 👑":""}<small style="display:block;opacity:.65">${p.coins}코인 · 빚 ${p.debt||0} · 누적 ${p.total}점</small></div><span class="${p.eliminated?"out":p.ready?"ready":"wait"}">${p.eliminated?"탈락":p.ready?"준비":"대기"}</span></div>`).join("");
 $("start").classList.toggle("hidden",!host);
 const active=activePlayers(),all=active.length>=2&&active.every(p=>p.ready),locked=state.running||!!m?.ready||!!m?.eliminated;
 $("start").disabled=state.running||!all;$("ready").disabled=locked;$("allin").disabled=locked;$("loan").disabled=locked||!m||m.coins>100||(m.loans||0)>=2;
 ["p1","p2","p3","bet"].forEach(x=>$(x).disabled=locked);
 $("status").innerHTML=m?.eliminated?"💀 코인이 0이 되어 탈락했습니다. 최종 순위를 기다리세요.":state.running?"🏁 경기 진행 중":all?"✅ 생존자 전원 준비 완료 · 방장이 시작하세요":`⏳ ${active.filter(p=>p.ready).length}/${active.length}명 준비 · 생존자 최소 2명`;
 if(state.race)renderRace(state.race);
 if(state.result&&state.result.version>seenResult)showResult(state.result);
}
function submitReady(){
 const m=me();if(!m)return alert("방장과 연결 중입니다.");
 if(m.eliminated)return alert("코인이 0이 되어 탈락했습니다.");
 const picks=[+$("p1").value,+$("p2").value,+$("p3").value],bet=Math.floor(+$("bet").value);
 if(picks.some(Number.isNaN)||new Set(picks).size<3)return alert("서로 다른 동물 3마리를 선택하세요.");
 if(!Number.isFinite(bet)||bet<0||bet>m.coins)return alert("보유 코인 안에서 베팅하세요.");
 if(host){Object.assign(m,{picks,bet,ready:true});sendState()}else actions.submit.send({id:myId,data:{picks,bet}})
}
function startRace(){
 if(!host||state.running)return;
 const active=activePlayers();
 if(active.length<2||!active.every(p=>p.ready))return alert("생존한 참가자 모두가 준비해야 합니다.");
 active.forEach(p=>p.coins-=p.bet);
 state.running=true;state.result=null;
 currentRaceId=`${state.round}-${Date.now()}-${Math.random().toString(36).slice(2,8)}`;
 state.race={raceId:currentRaceId,round:state.round,start:Date.now(),duration:18000,lap:1,progress:A.map((_,i)=>({i,v:0,seed:Math.random()*20})),order:[0,1,2,3,4,5]};
 sendState();clearInterval(timer);
 timer=setInterval(tick,80)
}
function tick(){
 const r=state.race,t=Math.min(1,(Date.now()-r.start)/r.duration);
 r.progress.forEach((x,i)=>{
   const wave=Math.sin(t*18+x.seed)*.025+Math.sin(t*43+x.seed)*.009;
   const sprint=t>.72?Math.max(0,Math.sin(t*35+x.seed))*.018:0;
   const catchup=(5-r.order.indexOf(i))*.002*(1-t);
   x.v=Math.max(x.v,Math.min(1,t+wave+sprint+catchup));
 });
 r.order=[...r.progress].sort((a,b)=>b.v-a.v).map(x=>x.i);r.lap=Math.min(4,Math.floor(Math.max(...r.progress.map(x=>x.v))*4)+1);
 renderRace(r);
 if(Date.now()-lastFrame>140){lastFrame=Date.now();actions.frame.send(r)}
 if(t>=1){clearInterval(timer);finishRace()}
}
function score(picks,actual){let total=0,exact=0;picks.forEach((a,i)=>{const d=Math.abs(actual.indexOf(a)-i);total+=d===0?5:d===1?3:d===2?2:1;if(d===0)exact++});if(picks[0]===actual[0])total+=3;if(exact===3)total+=15;return{total,exact}}
function mult(n){return n>=3?5:n===2?3:n===1?1.8:1}
function finishRace(){
 const actual=state.race.order,fac=state.round===10?2:1,contestants=activePlayers();
 const rows=contestants.map(p=>({...p,score:score(p.picks,actual)}));rows.forEach(r=>r.points=r.score.total*fac);
 const be=Math.max(...rows.map(r=>r.score.exact)),bp=Math.max(...rows.filter(r=>r.score.exact===be).map(r=>r.points)),wins=rows.filter(r=>r.score.exact===be&&r.points===bp);
 const pot=contestants.reduce((s,p)=>s+p.bet,0),mu=mult(be)*fac,prize=Math.floor(pot*mu),share=Math.floor(prize/wins.length);
 wins.forEach(w=>state.players.find(p=>p.id===w.id).coins+=share);rows.forEach(r=>state.players.find(p=>p.id===r.id).total+=r.points);
 const newlyEliminated=[];contestants.forEach(p=>{if(p.coins<=0){p.coins=0;p.eliminated=true;p.eliminatedRound=state.round;newlyEliminated.push(p.id)}});
 const final=state.round>=10||activePlayers().length<2;
 const finalRanking=final?[...state.players].map(p=>({...p,net:netWorth(p)})).sort((a,b)=>{
   if(!!a.eliminated!==!!b.eliminated)return a.eliminated?1:-1;
   if(a.eliminated&&b.eliminated&&(a.eliminatedRound||0)!==(b.eliminatedRound||0))return (b.eliminatedRound||0)-(a.eliminatedRound||0);
   return b.net-a.net||b.total-a.total
 }):[];
 const pens=["동물 울음소리 3번 하기","우승자에게 음료 가져다주기","20초간 우승 동물 흉내 내기","패배 소감 30초 발표하기","다음 게임 동안 모두에게 존댓말 쓰기"];
 const last=finalRanking.at(-1);
 state.running=false;state.result={version:Date.now(),actual,rows,winnerIds:wins.map(w=>w.id),newlyEliminated,pot,mu,prize,share,final,finalReason:state.round>=10?"10경기 종료":"생존자 1명 남음",finalRanking,lastId:last?.id||null,penalty:last?pens[Math.floor(Math.random()*pens.length)]:"벌칙 없음"};
 state.players.forEach(p=>{p.ready=false;p.picks=[];p.bet=0});sendState()
}
function nextRound(){
 if(!host){$("status").textContent="방장이 다음 경기로 넘어가기를 기다리는 중입니다.";return}
 const restart=!!state.result?.final;seenResult=Math.max(seenResult,Number(state.result?.version||0));state.result=null;state.race=null;state.running=false;currentRaceId="";
 if(restart){state.round=1;state.players.forEach(p=>Object.assign(p,{coins:300,debt:0,loans:0,total:0,ready:false,picks:[],bet:0,eliminated:false,eliminatedRound:null}))}else state.round++;
 $("overlay").classList.remove("show");resetInputs();actions.command.send({type:"next",version:seenResult});sendState();resetTrack()
}
function resetInputs(){
 ["p1","p2","p3"].forEach(x=>$(x).value="");
 const available=Math.max(0,Math.floor(me()?.coins||0));
 $("bet").max=available;$("bet").value=Math.min(50,available)
}
function resetTrack(){showStartingGrid();$("board").innerHTML="";$("lap").textContent="LAP 0 / 4";$("topLap").textContent="0";$("comment").textContent="6마리 모두 출발선에서 다음 경기를 기다리는 중"}
function pos(v,l){const t=v*8*Math.PI-Math.PI/2;return{x:50+Math.cos(t)*(39-l*.65),y:50+Math.sin(t)*(39-l*.5)}}
function renderRace(r){
 $("lap").textContent=`LAP ${r.lap||0} / 4`;$("topLap").textContent=r.lap||0;
 A.forEach((a,i)=>{const x=r.progress.find(q=>q.i===i);setRacer3D(i,x?.v||0,i,r.order[0]===i)});
 const lead=A[r.order[0]],sec=A[r.order[1]],g=((r.progress.find(x=>x.i===r.order[0]).v-r.progress.find(x=>x.i===r.order[1]).v)*100).toFixed(1);
 $("comment").innerHTML=r.lap===4?`🔥 마지막 바퀴! ${animalIcon(lead)} ${lead[0]} 선두`:`${animalIcon(lead)} ${lead[0]} 선두 · ${animalIcon(sec)} ${sec[0]} 추격 · 격차 ${g}%`;
 $("board").innerHTML=r.order.map((i,k)=>{const v=r.progress.find(x=>x.i===i).v;return`<div class="rank"><b>${k+1}</b><div>${animalIcon(A[i])}${A[i][0]}<div class="bar"><i style="width:${v*100}%"></i></div></div><span>${Math.floor(v*400)}m</span></div>`}).join("")
}
function showResult(res){
 seenResult=res.version;$("overlay").classList.add("show");$("resultTitle").textContent=res.final?"🏆 최종 순위 발표":"🏁 경기 결과";$("next").textContent=host?(res.final?"새 게임 시작":"다음 경기"):"방장을 기다리는 중";$("next").disabled=!host;
 if(res.final){
   const ranking=res.finalRanking||[],last=ranking.find(p=>p.id===res.lastId);
   $("result").innerHTML=`<div class="status">${res.finalReason||"게임 종료"} · 보유 코인에서 대출 상환액을 뺀 순자산 기준</div><table><tr><th>최종 순위</th><th>이름</th><th>상태</th><th>보유 코인</th><th>빚</th><th>순자산</th><th>누적 점수</th></tr>${ranking.map((p,i)=>`<tr class="${p.id===res.lastId?"last":i===0?"win":""}"><td>${i===0?"🥇 ":i===1?"🥈 ":i===2?"🥉 ":""}${i+1}위</td><td>${esc(p.name)}</td><td>${p.eliminated?`${p.eliminatedRound}경기 탈락`:"생존"}</td><td>${p.coins}</td><td>${p.debt||0}</td><td>${p.net}</td><td>${p.total}</td></tr>`).join("")}</table><div class="penalty">💀 최종 꼴찌: ${last?esc(last.name):"없음"}<br>🎯 벌칙: ${res.penalty}</div>`;
   return
 }
 const sorted=[...res.rows].sort((a,b)=>b.score.exact-a.score.exact||b.points-a.points);
 $("result").innerHTML=`<p><b>실제 TOP3:</b> ${res.actual.slice(0,3).map((i,k)=>`${k+1}위 ${animalIcon(A[i])} ${A[i][0]}`).join(" · ")}</p><table><tr><th>순위</th><th>이름</th><th>정확 적중</th><th>점수</th><th>코인</th></tr>${sorted.map((r,i)=>`<tr class="${res.winnerIds.includes(r.id)?"win":""}"><td>${i+1}</td><td>${esc(r.name)}</td><td>${r.score.exact}</td><td>${r.points}</td><td>${res.winnerIds.includes(r.id)?`+${res.share}`:`-${r.bet}`}</td></tr>`).join("")}</table><div class="status">배수 ${res.mu}배 · 총 상금 ${res.prize}코인 · 우승자 1인당 ${res.share}코인</div>${res.newlyEliminated?.length?`<div class="penalty">💀 코인 0 탈락: ${state.players.filter(p=>res.newlyEliminated.includes(p.id)).map(p=>esc(p.name)).join(", ")}</div>`:""}`
}
</script>
